<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">codex-team-runtime 轻量 RSI 闭环</title><desc id="desc">用户按需发起；独立优化会话使用已有证据选题；Worker 完成候选和测试，经过独立审查后由用户确认安装；全团队正常使用，体验为主、数据辅助判断效果。没有依据可以不改；需要回退由用户确认。只优化协作层，不增加 Worker 负担。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#147d79"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b17618"/></marker></defs><rect width="1600" height="900" fill="#f5f8fb"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><text x="64" y="58" font-size="34" fill="#183145">codex-team-runtime · 轻量 RSI 闭环</text><text x="64" y="94" font-size="20" fill="#4b6374">让自己的团队用起来更顺：体验为主，现有数据辅助；只优化协作层。</text><rect x="1336" y="32" width="200" height="40" rx="20" fill="#e2eeed"/><text x="1356" y="58" font-size="16" fill="#147d79">2026-10-29 · 方案</text><rect x="440" y="128" width="344" height="74" rx="14" fill="#eaf0f4" stroke="#d5e1e9"/><text x="464" y="158" font-size="20" fill="#183145">可以不修改</text><text x="464" y="185" font-size="16" fill="#4b6374">记录原因与证据缺口</text><path d="M 612 250 L 612 206" fill="none" stroke="#147d79" stroke-width="2.5" marker-end="url(#arrow)" stroke-linejoin="round"/><text x="628" y="233" font-size="16" fill="#4b6374">暂无依据</text><text x="64" y="232" font-size="15" fill="#147d79">01—04  形成并审查候选</text><text x="794" y="232" font-size="15" fill="#147d79">有依据，形成一个主要优化假设</text><g><rect x="64" y="254" width="344" height="144" rx="18" fill="#ffffff" stroke="#d5e1e9" stroke-width="1.5"/><circle cx="94" cy="286" r="16" fill="#147d79"/><text x="94" y="292" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">1</text><text x="120" y="294" font-size="22" font-weight="700" fill="#183145">用户发起优化</text><text x="88" y="331" font-size="17" fill="#4b6374">按需启动独立优化会话</text><text x="88" y="356" font-size="17" fill="#4b6374">确认协作层范围</text></g><g><rect x="440" y="254" width="344" height="144" rx="18" fill="#ffffff" stroke="#d5e1e9" stroke-width="1.5"/><circle cx="470" cy="286" r="16" fill="#147d79"/><text x="470" y="292" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">2</text><text x="496" y="294" font-size="22" font-weight="700" fill="#183145">证据选题与假设</text><text x="464" y="331" font-size="17" fill="#4b6374">已有台账、时间线、指标</text><text x="464" y="356" font-size="17" fill="#4b6374">自主选题；写清问题、改法与预期</text></g><g><rect x="816" y="254" width="344" height="144" rx="18" fill="#ffffff" stroke="#d5e1e9" stroke-width="1.5"/><circle cx="846" cy="286" r="16" fill="#147d79"/><text x="846" y="292" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">3</text><text x="872" y="294" font-size="22" font-weight="700" fill="#183145">候选与相关测试</text><text x="840" y="331" font-size="17" fill="#4b6374">Worker 完成改动和自测</text><text x="840" y="356" font-size="17" fill="#4b6374">不增加启动、恢复或汇报步骤</text></g><g><rect x="1192" y="254" width="344" height="144" rx="18" fill="#ffffff" stroke="#d5e1e9" stroke-width="1.5"/><circle cx="1222" cy="286" r="16" fill="#147d79"/><text x="1222" y="292" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">4</text><text x="1248" y="294" font-size="22" font-weight="700" fill="#183145">独立审查</text><text x="1216" y="331" font-size="17" fill="#4b6374">核对结果、通用性、兼容与证据</text><text x="1216" y="356" font-size="17" fill="#4b6374">明确缺陷：修正后复验</text></g><path d="M 412 326 L 436 326" fill="none" stroke="#147d79" stroke-width="2.5" marker-end="url(#arrow)" stroke-linejoin="round"/><path d="M 788 326 L 812 326" fill="none" stroke="#147d79" stroke-width="2.5" marker-end="url(#arrow)" stroke-linejoin="round"/><path d="M 1164 326 L 1188 326" fill="none" stroke="#147d79" stroke-width="2.5" marker-end="url(#arrow)" stroke-linejoin="round"/><path d="M 1364 402 L 1364 490" fill="none" stroke="#147d79" stroke-width="2.5" marker-end="url(#arrow)" stroke-linejoin="round"/><text x="1382" y="452" font-size="16" fill="#147d79">审查通过</text><text x="64" y="472" font-size="15" fill="#147d79">08—05  真实使用与去留判断（向左）</text><g><rect x="1192" y="494" width="344" height="144" rx="18" fill="#fff9ed" stroke="#e9c77d" stroke-width="1.5"/><circle cx="1222" cy="526" r="16" fill="#b17618"/><text x="1222" y="532" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">5</text><text x="1248" y="534" font-size="22" font-weight="700" fill="#183145">用户确认安装</text><text x="1216" y="571" font-size="17" fill="#4b6374">相关自测与独立审查完成</text><text x="1216" y="596" font-size="17" fill="#4b6374">保留可恢复的版本</text></g><g><rect x="816" y="494" width="344" height="144" rx="18" fill="#ffffff" stroke="#d5e1e9" stroke-width="1.5"/><circle cx="846" cy="526" r="16" fill="#147d79"/><text x="846" y="532" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">6</text><text x="872" y="534" font-size="22" font-weight="700" fill="#183145">所有团队安装试用</text><text x="840" y="571" font-size="17" fill="#4b6374">确认后安装，继续正常交付</text><text x="840" y="596" font-size="17" fill="#4b6374">新任务优先；在途策略保持</text></g><g><rect x="440" y="494" width="344" height="144" rx="18" fill="#ffffff" stroke="#d5e1e9" stroke-width="1.5"/><circle cx="470" cy="526" r="16" fill="#147d79"/><text x="470" y="532" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">7</text><text x="496" y="534" font-size="22" font-weight="700" fill="#183145">正常使用与反馈</text><text x="464" y="571" font-size="17" fill="#4b6374">体验为主，现有数据辅助</text><text x="464" y="596" font-size="17" fill="#4b6374">不要求业务 Worker 额外汇报</text></g><g><rect x="64" y="494" width="344" height="144" rx="18" fill="#ffffff" stroke="#d5e1e9" stroke-width="1.5"/><circle cx="94" cy="526" r="16" fill="#147d79"/><text x="94" y="532" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">8</text><text x="120" y="534" font-size="22" font-weight="700" fill="#183145">判断效果与处置</text><text x="88" y="571" font-size="17" fill="#4b6374">保留 / 收窄 / 继续观察 / 暂停</text><text x="88" y="596" font-size="17" fill="#4b6374">按影响范围处理异常</text></g><path d="M 1188 566 L 1164 566" fill="none" stroke="#147d79" stroke-width="2.5" marker-end="url(#arrow)" stroke-linejoin="round"/><path d="M 812 566 L 788 566" fill="none" stroke="#147d79" stroke-width="2.5" marker-end="url(#arrow)" stroke-linejoin="round"/><path d="M 436 566 L 412 566" fill="none" stroke="#147d79" stroke-width="2.5" marker-end="url(#arrow)" stroke-linejoin="round"/><path d="M 236 642 L 236 720" fill="none" stroke="#b17618" stroke-width="2.5" marker-end="url(#amber)" stroke-linejoin="round"/><text x="250" y="683" font-size="16" fill="#9a6515">需要回退</text><rect x="64" y="724" width="344" height="82" rx="14" fill="#fff9ed" stroke="#e9c77d"/><text x="88" y="756" font-size="20" fill="#8a5b13">用户确认回退</text><text x="88" y="783" font-size="16" fill="#4b6374">保留在途记录；未知投递先对账</text><rect x="440" y="724" width="1096" height="82" rx="14" fill="#eaf0f4"/><text x="464" y="756" font-size="20" fill="#183145">两周回看 · 不创建后台轮询 · 真实使用不足时如实记录</text><text x="464" y="783" font-size="16" fill="#4b6374">留下结果与分歧，下一轮由用户按需发起；严格 A/B 和样本齐全是可选的增强证据。</text><text x="64" y="857" font-size="16" fill="#4b6374">这是目标流程；本次只提交方案与图，不代表 RSI 控制器已经实现或启用。</text></g></svg>
